<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f4">
<meta name="robots" content="noindex">
<title>배회·실종 치매환자 발견 모의훈련</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#12261c;--ink2:#51665a;--paper:#f5f7f4;--card:#fff;--line:#dce5de;--green:#2a8a4a;--green-d:#1d6b37;--leaf:#e6f3ea;--amber:#f5b82e;--bad:#b9400f;--badbg:#fdeee6;--r:20px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
#app{max-width:520px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:1.75rem;line-height:1.25;font-weight:800;letter-spacing:-.035em;margin:0 0 6px}
h2{font-size:1.1rem;font-weight:700;margin:0 0 10px;letter-spacing:-.02em}
h3{font-size:1rem;font-weight:700;margin:0 0 8px}
p{margin:0 0 10px}
.lead{color:var(--ink2);margin-bottom:18px}
.hero{padding:6px 0 22px}
.hero h1{font-size:2rem}
.block{margin:0 0 22px}
.lab{display:block;font-weight:700;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 18px}
.sel{position:relative}
.sel:after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--ink2);border-bottom:2.5px solid var(--ink2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select,input[type=text],input[type=tel],input[type=password],input[type=number],input[type=datetime-local],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:54px;appearance:none;-webkit-appearance:none}
select{padding-right:44px}
textarea{min-height:90px;resize:vertical}
::placeholder{color:#97a79d}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;padding:14px 18px;margin-top:6px}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:var(--card);color:var(--green-d);border:1.5px solid var(--green)}
.btn.ghost:hover{background:var(--leaf)}
.rbtn{font:inherit;font-size:.8rem;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}tr.hid td{color:#aaa;text-decoration:line-through}tr.hid td:last-child{text-decoration:none}
a.btn{text-decoration:none;text-align:center}
.btn.sm{min-height:46px;font-size:.95rem;width:auto;display:inline-block;padding:10px 18px}
.link{background:none;border:0;font:inherit;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 4px;font-size:.95rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 0}.duo .btn{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;text-decoration:none;font-size:1rem;min-height:74px}.duo .btn b{font-size:1.35rem;line-height:1.2}
.vwrap{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000;margin:0 0 16px}.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.err{color:var(--bad);font-weight:600;margin:10px 0 0;min-height:1.4em}
.okmsg{color:var(--green-d);font-weight:600}
.tagbox{display:flex;justify-content:center;margin:2px 0 16px}
.tagimg{position:relative;width:min(260px,70%);container-type:inline-size}
.tagimg img{display:block;width:100%;height:auto}
.tagimg b{position:absolute;left:29.5%;width:42%;top:72.4%;height:10%;display:flex;align-items:center;justify-content:center;font-size:6.2cqw;font-weight:800;color:#222;letter-spacing:.02em}
/* 진행 표시 */
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 22px}
.prog i{display:block;height:5px;border-radius:3px;background:var(--line)}
.prog span{font-size:.78rem;color:var(--ink2);margin-top:5px;display:block}
.prog div.on i{background:var(--green)}.prog div.on span{color:var(--green-d);font-weight:700}
/* 장면 */
.scene{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;align-items:start;margin:0 0 20px}
.photo{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#fff;line-height:0}
.photo img{width:100%;height:auto;display:block}
.facts{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.92rem;line-height:1.4}
.facts dt{color:var(--ink2)}.facts dd{margin:0;font-weight:600}
.facts h3{font-size:.9rem;color:var(--ink2);font-weight:600}
.facts .tagimg{width:100%;margin-bottom:12px}
/* 폼 */
.fld{margin:0 0 18px}
.fld>.lab{font-size:.95rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{font-size:.82rem;color:var(--ink2);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chips label{position:relative;cursor:pointer}
.chips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.chips span{display:inline-flex;align-items:center;gap:7px;min-height:46px;padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-weight:500}
.chips input:checked+span{background:var(--leaf);border-color:var(--green);color:var(--green-d);font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid #0003;flex:none}
.chips.five span{min-width:52px;justify-content:center;padding:9px 0}
.scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink2);margin:-2px 2px 4px}
.sect{font-size:.95rem;font-weight:800;color:var(--green-d);margin:26px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
/* 결과 */
.score{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.score b{font-size:3rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--green-d)}
.score span{color:var(--ink2);font-size:1.1rem}
.res{list-style:none;margin:0;padding:0}
.res li{display:grid;grid-template-columns:1.6rem 5.4rem 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.93rem;line-height:1.4;align-items:start}
.res li:last-child{border:0}
.res .m{font-weight:800}.res .o .m{color:var(--green-d)}.res .x .m{color:var(--bad)}
.res .k{color:var(--ink2)}
.res .a s{color:var(--bad);text-decoration-thickness:1.5px}
.say{background:#fff8e3;border-left:5px solid var(--amber);border-radius:6px 14px 14px 6px;padding:14px 16px;margin:0 0 14px;line-height:1.7}
/* 순서 */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 18px}
.slot{aspect-ratio:1/1.25;border:1.5px dashed #b8c8bc;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.78rem;font-weight:700;background:var(--card);padding:2px;text-align:center;font-family:inherit;color:var(--ink);cursor:default}
.slot.f{border-style:solid;border-color:var(--green);background:var(--leaf);cursor:pointer}
.slot .n{font-size:.72rem;color:var(--ink2);font-weight:600}
.slot.f.right{border-color:var(--green)}.slot.f.wrong{border-color:var(--bad);background:var(--badbg)}
.slot svg{width:26px;height:26px}
.deck{display:grid;gap:10px;margin:0 0 14px}
.cardstep{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;min-height:68px}
.cardstep:hover{border-color:var(--green)}
.cardstep svg,.slot svg,.ans svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cardstep .ic{width:46px;height:46px;border-radius:14px;background:var(--leaf);color:var(--green-d);display:flex;align-items:center;justify-content:center;flex:none}
.cardstep .ic svg{width:26px;height:26px}
.cardstep b{display:block;font-size:1.02rem}
.cardstep small{color:var(--ink2);font-size:.86rem;line-height:1.35;display:block}
.ans{list-style:none;margin:0 0 14px;padding:0;counter-reset:s}
.ans li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ans li:last-child{border:0}
.ans .ic{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ans .ic svg{width:22px;height:22px}
.ans b{display:block}.ans small{color:var(--ink2);font-size:.86rem;line-height:1.35;display:block}
.banner{display:inline-flex;gap:8px;align-items:center;background:var(--badbg);color:var(--bad);border-radius:12px;padding:8px 12px;font-size:.85rem;font-weight:600;margin:0 0 14px}
/* 설정 */
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw:last-child{border:0}
.sw input{position:absolute;opacity:0}
.sw i{flex:none;width:50px;height:30px;border-radius:15px;background:#c8d3cb;position:relative;transition:background .15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .15s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i:after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--amber);outline-offset:2px}
.sw span small{display:block;color:var(--ink2);font-size:.8rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:.82rem;color:var(--ink2)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:.84rem;white-space:nowrap}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--leaf);color:var(--green-d);font-weight:700;position:sticky;top:0}
.consent{font-size:.85rem;color:var(--ink2);background:var(--paper);border-radius:12px;padding:12px;margin:10px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:.95rem}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--green)}
.center-t{display:inline-block;background:var(--leaf);color:var(--green-d);font-weight:700;font-size:.85rem;border-radius:999px;padding:4px 12px;margin:0 0 10px}
/* 보물찾기 */
.hero .sub{color:var(--ink2);margin:6px 0 0;font-size:1rem}
.huntimg{position:relative;width:min(74%,260px);margin:0 auto 14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);line-height:0;background:#fff;user-select:none;-webkit-user-select:none}
.huntimg>img{width:100%;height:auto;display:block;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-50%);width:21%;padding:0;border:0;background:none;cursor:pointer;line-height:0}
.spot:before{content:"";position:absolute;inset:-14px}
.spot img{width:100%;height:auto;display:block;border-radius:50%;filter:drop-shadow(0 1px 2px #0005)}
.spot.hint{animation:ring 1.3s ease-out infinite;border-radius:50%}
.spot.found img{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 8px var(--amber))}
@keyframes ring{0%{box-shadow:0 0 0 0 #f5b82ecc}100%{box-shadow:0 0 0 22px #f5b82e00}}
@keyframes pop{0%{transform:scale(1)}60%{transform:scale(1.9)}100%{transform:scale(1.5)}}
.hmsg{text-align:center;font-weight:700;color:var(--ink2);min-height:3.2em;margin:0 0 6px}
.hmsg.ok{color:var(--green-d)}
.bar{position:sticky;bottom:0;z-index:5;display:grid;gap:10px;padding:14px 0 calc(12px + env(safe-area-inset-bottom));margin-top:6px;background:linear-gradient(to top,var(--paper) 72%,transparent)}
.bar.two{grid-template-columns:1fr 2fr}
.bar .btn{margin:0}
.bar[hidden],.bar .btn[hidden],section[hidden]{display:none}
.fab{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:.9rem;padding:12px 18px;box-shadow:0 4px 14px #0004;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .btn{margin-top:14px}
.badge{text-align:center}
.stars{font-size:2.8rem;letter-spacing:.1em;line-height:1.1;color:#d5ddd7}
.stars b{color:var(--amber);font-weight:400}
.badge .t{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px}
.badge p{color:var(--ink2);margin:0;font-size:.92rem}
.pg{font-size:.85rem;color:var(--ink2);font-weight:700;margin:0 0 4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:380px){body{font-size:16px}h1{font-size:1.55rem}.hero h1{font-size:1.8rem}.res li{grid-template-columns:1.4rem 4.6rem 1fr}}

QS.filter(q=>c.q[q.id]).forEach(q=>{const el=q.k==='tx'?$(`textarea[name=${q.id}]`):document.querySelector(`input[name=${q.id}]:checked`);a[q.id]=el?el.value.trim():''});
let tel='';if(c.phone){tel=$('#tel').value.trim();if(tel){if(num(tel).length<10)return $('#m').textContent='휴대전화 번호를 정확히 입력해 주세요.';if(!$('#agree').checked)return $('#m').textContent='번호를 입력하셨다면 개인정보 수집·이용에 동의해 주세요.'}}
const d={time:now(),center:S.center,patient:S.pi+1,score:S.score,total:S.total,order_ok:S.okOrder?1:0,order_tries:S.tries,...a,phone:tel};
const b=e.submitter||$('#sf .btn');b.disabled=true;try{await addResp(d)}catch(x){b.disabled=false;return $('#m').textContent='제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'}go('done')}}}};
V.done=()=>{const pct=S.score/S.total,st=1+(pct>=.6?1:0)+(pct>=.9&&S.okOrder?1:0),T=['','첫걸음 · 다음엔 더 잘할 수 있어요','든든한 이웃','치매안심 지킴이'][st];
return{h:`<header class=hero><h1>미션 완료!</h1></header>
<section class="card badge"><div class=stars aria-label="별 ${st}개">${[1,2,3].map(k=>k<=st?'<b>★</b>':'★').join('')}</div><div class=t>${T}</div><p>신고서 ${S.score}/${S.total} · 대처 순서 ${S.okOrder?'정답':'다음엔 꼭!'}</p></section>
<section class=card><h2>길 잃은 어르신을 만나면</h2>${ansList()}</section>${S.cfg.phone&&S.cfg.msg&&!S.replay?`<p class=say>${esc(S.cfg.msg)}</p>`:''}
<div class=bar><button class=btn id=more>다른 어르신 한 번 더 신고하기</button><button class="btn ghost" id=again>처음으로</button></div>`,
i(){$('#again').onclick=()=>go('home');$('#more').onclick=()=>{let n;do{n=Math.floor(Math.random()*PT.length)}while(n===S.pi);S.pi=n;S.tries=0;S.slots=[];S.deck=null;S.okOrder=false;S.replay=true;go('t1')}}}};
/* ===== 관리자 ===== */
V.login=()=>{const m=S.t==='m';return{h:`<h1>${m?'광역치매센터':'치매안심센터'} 관리자</h1><p class=lead>비밀번호를 입력하세요.</p>${API?'':'<p class=banner>시연 모드 · 이 기기에서만 저장되며 비밀번호를 확인하지 않아요</p>'}<form id=lf class=card>${m?'':`<div class=fld><label class=lab for=lc>센터</label><div class=sel><select id=lc>${CENTERS.map(c=>`<option ${c===S.center?'selected':''}>${c}</option>`).join('')}</select></div></div>`}<div class=fld><label class=lab for=pw>비밀번호</label><input type=password id=pw autocomplete=current-password></div><button class=btn type=submit>들어가기</button><p id=m class=err role=alert></p></form><button class=link id=bk>← 처음으로</button>`,
i(){$('#bk').onclick=()=>go('home');$('#lf').onsubmit=async e=>{e.preventDefault();const c=m?'':$('#lc').value,pw=$('#pw').value;if(!pw)return $('#m').textContent='비밀번호를 입력해 주세요.';
try{const r=await doLogin(c,pw);if(r.err)return $('#m').textContent=r.err==='lock'?'비밀번호를 여러 번 틀려 잠겼어요. 10분 뒤에 다시 시도해 주세요.':'비밀번호가 맞지 않아요.';
S.pw=pw;S.role=r.role;m?go('rs',{rc:''}):go('ac',{ac:c})}catch(x){$('#m').textContent='서버에 연결하지 못했어요. 인터넷 연결과 API 주소를 확인해 주세요.'}}}}};
V.ac=async()=>{const g=await getCfg(S.ac),sw=(id,t,on,sub)=>`<label class=sw><span>${t}${sub?`<small>${sub}</small>`:''}</span><input type=checkbox id=${id} ${on?'checked':''} role=switch><i></i></label>`;
return{h:`<h1>치매안심센터 관리자</h1><span class=center-t>${S.ac}</span>
${S.role==='master'?`<div class=fld><label class=lab for=sc>설정할 센터</label><div class=sel><select id=sc>${CENTERS.map(c=>`<option ${c===S.ac?'selected':''}>${c}</option>`).join('')}</select></div></div>`:''}
<section class=card><h2>설문 문항</h2><p class=grp>끄면 참가자 화면에서 사라집니다.</p>${QS.map(q=>sw(q.id,q.t,g.q[q.id])).join('')}</section>
<section class=card><h2>경품용 전화번호</h2>${sw('phone','전화번호 입력칸 보이기',g.phone,'기프티콘·현물 경품 지급이 있을 때 켜세요')}<div class=fld style="margin-top:12px"><label class=lab for=msg>경품 안내 문구</label><input type=text id=msg maxlength=80 value="${esc(g.msg)}" placeholder="예: 기프티콘을 문자로 보내 드려요"></div></section>
<button class=btn id=save>설정 저장</button><p id=m class=err role=alert></p>
<button class="btn ghost" id=res>응답 결과 보기</button><button class="btn ghost" id=cp>이 센터 접속 주소 복사</button><button class=link id=bk>← 처음으로</button>`,
i(){const sc=$('#sc');sc&&(sc.onchange=()=>go('ac',{ac:sc.value}));$('#bk').onclick=()=>{S.pw='';S.role='';go('home')};
$('#res').onclick=()=>go('rs',{rc:S.ac});
$('#cp').onclick=async()=>{const u=location.origin+location.pathname+'?c='+(CENTERS.indexOf(S.ac)+1);try{await navigator.clipboard.writeText(u);$('#m').className='okmsg';$('#m').textContent='복사했어요: '+u}catch(e){$('#m').className='err';$('#m').textContent=u}};
$('#save').onclick=async()=>{const q={};QS.forEach(x=>q[x.id]=$('#'+x.id).checked?1:0);try{await setCfg(S.ac,{q,phone:+$('#phone').checked,msg:$('#msg').value.trim()});$('#m').className='okmsg';$('#m').textContent='저장했어요.'}catch(e){$('#m').className='err';$('#m').textContent=e==='pw'||e==='lock'?'권한이 없어요. 다시 로그인해 주세요.':'저장하지 못했어요. 연결을 확인해 주세요.'}}}}};
const HEAD=[['time','일시'],['center','센터'],['patient','어르신 번호'],['score','신고서 점수'],['total','신고서 문항수'],['order_ok','순서 정답(1=정답)'],['order_tries','순서 시도 횟수'],...QS.map(q=>[q.id,q.t]),['phone','전화번호']];
V.gb=()=>({h:`<h1>게임 순위 관리</h1><p class=lead>부적절한 닉네임은 '숨기기'로 순위표에서 뺄 수 있어요. 언제든 복구할 수 있어요.</p><div id=gbb><p class=lead>불러오는 중…</p></div><button class=link id=bk>← 돌아가기</button>`,
async i(){$('#bk').onclick=()=>go('rs',{rc:S.rc||''});const load=async()=>{let r;try{r=API?await call({a:'bmlist',c:'',pw:S.pw}):[]}catch(e){r={err:1}}
if(!Array.isArray(r)){$('#gbb').innerHTML='<p class=err>불러오지 못했어요. 다시 로그인해 주세요.</p>';return}
$('#gbb').innerHTML=r.length?`<div class=tbl><table><tr><th>순위<th>닉네임<th>점수<th>시간<th>일시<th>관리</tr>${r.slice(0,200).map((x,i)=>`<tr class="${x.hidden?'hid':''}"><td>${i+1}<td>${esc(x.nick)}<td>${x.xp}<td>${Math.floor(x.sec/60)}:${String(x.sec%60).padStart(2,'0')}<td>${esc(String(x.time).slice(5,16))}<td><button class=rbtn data-row="${x.row}" data-v="${x.hidden?0:1}">${x.hidden?'복구':'숨기기'}</button>`).join('')}</table></div>`:'<p class=lead>아직 기록이 없어요.</p>';
$$('#gbb .rbtn').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await call({a:'bhide',c:'',pw:S.pw,row:+b.dataset.row,v:+b.dataset.v});if(r.err)throw 0;load()}catch(e){b.disabled=false;alert('처리하지 못했어요. 다시 로그인해 주세요.')}})};load()}});
V.rs=()=>{const m=S.role==='master';return{h:`<h1>${m?'광역치매센터 관리자':'응답 결과'}</h1>${m?`<div class=fld><label class=lab for=rf>센터 보기</label><div class=sel><select id=rf><option value="">전체 센터</option>${CENTERS.map(c=>`<option ${c===S.rc?'selected':''}>${c}</option>`).join('')}</select></div></div>`:`<span class=center-t>${S.rc}</span>`}<div id=rb><p class=lead>불러오는 중…</p></div>
${m&&S.rc?'<button class="btn ghost" id=ed>이 센터 설정 열기</button>':''}${m?'<button class="btn ghost" id=gb>게임 순위 관리</button>':''}<button class=link id=bk>← 돌아가기</button>`,
async i(){const rf=$('#rf');rf&&(rf.onchange=()=>go('rs',{rc:rf.value}));const ed=$('#ed');ed&&(ed.onclick=()=>go('ac',{ac:S.rc}));const gb=$('#gb');gb&&(gb.onclick=()=>go('gb'));
$('#bk').onclick=()=>m?(S.pw='',S.role='',go('home')):go('ac',{ac:S.rc});
try{const all=await listResp(m?S.rc:S.ac),r=all.filter(x=>!+x.hidden);S.rows=r;const avg=k=>{const v=r.map(x=>+x[k]).filter(n=>n>0);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-'};
const pct=r.length?Math.round(r.reduce((a,x)=>a+(x.total?x.score/x.total:0),0)/r.length*100)+'%':'-';
const first=r.length?Math.round(r.filter(x=>+x.order_ok&&+x.order_tries===1).length/r.length*100)+'%':'-';
const by={};r.forEach(x=>by[x.center]=(by[x.center]||0)+1);
$('#rb').innerHTML=`<div class=stats><div class=stat><b>${r.length}명</b><span>참여</span></div><div class=stat><b>${pct}</b><span>신고서 평균 정답률</span></div><div class=stat><b>${first}</b><span>순서 첫 시도 정답률</span></div><div class=stat><b>${avg('q7')}</b><span>만족도 (5점)</span></div></div>
${m&&!S.rc?`<h2>센터별 참여</h2><div class=tbl><table><tr><th>센터<th>참여</tr>${CENTERS.map(c=>`<tr><td>${c.replace(' 치매안심센터','')}<td>${by[c]||0}명`).join('')}</table></div>`:''}
<button class=btn id=csv ${r.length?'':'disabled'}>엑셀용 CSV 내려받기</button>
<h2 style="margin-top:20px">최근 응답</h2>${r.length?`<div class=tbl><table><tr><th>일시<th>센터<th>점수<th>순서<th>한줄평<th>전화번호<th>관리</tr>${(m?all:r).slice(-50).reverse().map(x=>`<tr class="${+x.hidden?'hid':''}"><td>${esc(x.time)}<td>${esc(String(x.center).replace(' 치매안심센터',''))}<td>${x.score}/${x.total}<td>${+x.order_ok?'○':'×'}<td>${esc(x.q8)}<td>${esc(x.phone)}<td><button class=rbtn data-row="${x.row}" data-v="${+x.hidden?0:1}">${+x.hidden?'복구':'숨기기'}</button>`).join('')}</table></div>${m?'':'<p class=lead style="font-size:.85rem">잘못 입력된 응답은 \'숨기기\'로 통계에서 뺄 수 있어요. 복구는 광역치매센터 관리자만 할 수 있어요.</p>'}`:'<p class=lead>아직 응답이 없어요.</p>'}`;
$$('.rbtn').forEach(b=>b.onclick=async()=>{const v=+b.dataset.v;if(v&&!confirm('이 응답을 숨길까요?\n통계와 목록에서 빠지며, 복구는 광역치매센터 관리자만 할 수 있어요.'))return;b.disabled=true;try{await hideResp(+b.dataset.row,v);go('rs',{rc:S.rc})}catch(e){b.disabled=false;alert('처리하지 못했어요. 다시 로그인해 주세요.')}});
$('#csv').onclick=()=>{const q=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
const s='﻿'+[HEAD.map(h=>q(h[1])).join(','),...S.rows.map(r=>HEAD.map(h=>q(r[h[0]])).join(','))].join('\r\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='모의훈련_응답.csv';a.click()}}
catch(e){$('#rb').innerHTML='<p class=err>결과를 불러오지 못했어요. 다시 로그인해 주세요.</p>'}}}};
go('home');
</script></body></html>
