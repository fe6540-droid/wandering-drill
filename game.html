<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0d3b44">
<title>골든타임 미션 | 배회·실종 치매환자 발견 모의훈련</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 화면에 미션 하나. 위에 HUD, 가운데 퍼즐 카드, 아래에 사진 조각 진행 경로 */
:root{
  --night:#0d3b44; --night2:#12515a; --mint:#5fe3b0; --sun:#ffc83d; --coral:#ff6b5e;
  --paper:#fbfdfc; --ink:#10292e; --mute:#5c7378; --line:#d5e3e0;
  --display:'Do Hyeon','Noto Sans KR',sans-serif; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--night);color:#fff;font-family:var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;word-break:keep-all;overflow-wrap:break-word;
 background-image:radial-gradient(circle at 15% 8%,#ffffff22 0 2px,transparent 3px),radial-gradient(circle at 82% 14%,#ffffff22 0 1.5px,transparent 3px),radial-gradient(circle at 60% 4%,#ffffff1a 0 2px,transparent 3px)}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.back{color:#bfe3da;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:4px 2px;align-self:flex-start}
.demo{font-size:.72rem;color:#bfe3da;text-align:center;border:1px dashed #5fe3b066;border-radius:999px;padding:5px 10px}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.hearts{display:flex;gap:4px}.hearts svg{width:22px;height:22px}.hearts .off{opacity:.25;filter:grayscale(1)}
.xplab{display:flex;justify-content:space-between;font-size:.72rem;color:#bfe3da}
.xpbar{height:10px;border-radius:99px;background:#ffffff22;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#ffe27a);border-radius:99px;transition:width .5s}
.clock{font-family:var(--display);font-size:1.15rem;color:var(--sun);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.clock small{display:block;font-family:var(--body);font-size:.62rem;color:#bfe3da;margin-top:3px}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:18px 16px 16px;box-shadow:0 8px 0 #0a2c33;display:flex;flex-direction:column;gap:12px}
.tagline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--mute);font-weight:700}
.badge{background:var(--night);color:var(--mint);font-family:var(--display);font-size:.95rem;padding:3px 11px;border-radius:99px}
.diff{margin-left:auto;display:flex;gap:2px;color:#e3a90b;font-size:.9rem;letter-spacing:1px}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.25;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:0}
p{margin:0;line-height:1.55}.hint{font-size:.85rem;color:var(--mute)}
.call{background:#eef5f3;border-radius:14px;padding:10px 12px;font-size:.88rem;line-height:1.5;border-left:5px solid var(--night2)}
.opts{display:grid;gap:8px}.opts.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-weight:700;text-align:left;padding:12px 13px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;line-height:1.4;min-height:48px}
.opt:active{transform:translateY(2px)}
.opt.pick{border-color:var(--night2);background:#e6f6f1}
.opt.ok{border-color:#1e9e6e;background:#d6f5e8}.opt.no{border-color:var(--coral);background:#ffe4e0}
.opt:disabled{cursor:default}
.opt:focus-visible,.go:focus-visible,.key:focus-visible,.th:focus-visible,.chip:focus-visible,.slot:focus-visible,.dg:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.fb{border-radius:14px;padding:12px 14px;font-size:.9rem;line-height:1.5}.fb.ok{background:#d6f5e8;color:#0d5b3f}.fb.no{background:#ffe4e0;color:#8a2a20}
.go{font:inherit;font-family:var(--display);font-size:1.15rem;border:0;border-radius:16px;padding:13px;background:var(--sun);color:#3a2a00;cursor:pointer;box-shadow:0 5px 0 #c99a14}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a14}
.go[disabled]{background:#e1e8e6;color:#8da0a3;box-shadow:0 5px 0 #c3cfcc;cursor:default}
.go.ghost{background:#fff;border:2px solid var(--night2);color:var(--night2);box-shadow:none;font-size:1rem;padding:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.cards .opt{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.em{font-size:1.7rem;line-height:1}
#pl .opt{display:flex;align-items:center;gap:10px;padding:8px 10px}
.ci{flex:none;width:58px;height:58px;border-radius:12px;overflow:hidden;background:#e6f6f1;display:grid;place-items:center;font-size:1.9rem}.ci img{width:100%;height:100%;object-fit:cover;display:block}
.slot .ci{width:40px;height:40px;font-size:1.3rem}
.ban{width:100%;max-height:190px;object-fit:cover;border-radius:14px;display:block}
/* M1 사진 추리 */
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.th{border:3px solid transparent;border-radius:12px;padding:0;background:#dfe9e6;cursor:pointer;overflow:hidden;aspect-ratio:1/2.6}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.out{opacity:.3;filter:grayscale(1)}.th.ok{border-color:#1e9e6e}.th.no{border-color:var(--coral)}
.clues{display:flex;flex-direction:column;gap:6px}
.clue{background:#fff7dc;border-radius:12px;padding:9px 12px;font-weight:700;font-size:.92rem}
/* 카드 그리드(배회 신호, 분류) */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards .opt{font-size:.86rem;min-height:64px}
/* M2 인식표·키패드 */
.tagbox{background:linear-gradient(#cdeefc,#e8f7ef);border-radius:16px;padding:10px;display:grid;place-items:center;position:relative;min-height:150px}
.tagbox svg{width:min(260px,100%)}
.cover{position:absolute;inset:0;border-radius:16px;background:#12515a;color:#bfe3da;display:grid;place-items:center;text-align:center;font-weight:700;font-size:.95rem}
.timer{height:6px;border-radius:9px;background:#dfe9e6;overflow:hidden}.timer i{display:block;height:100%;width:100%;background:var(--sun)}
.digits{display:flex;justify-content:center;gap:5px}
.dg{color:var(--ink);width:34px;height:44px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;background:#fff}
.dg.cur{border-color:var(--night2);background:#e6f6f1}.dg.bad{border-color:var(--coral);background:#ffe4e0}.dg.pick{border-color:var(--coral);background:#ffe4e0}.dg.okk{border-color:#1e9e6e;background:#d6f5e8}
button.dg{cursor:pointer;font-family:var(--display);color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.key{font:inherit;font-family:var(--display);font-size:1.15rem;border:0;border-radius:11px;padding:10px 0;background:#e6efed;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #c3cfcc}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #c3cfcc}
/* M3 몽타주 */
.mont{display:flex;gap:12px;align-items:flex-start}
.mont .ph{flex:none;width:96px;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/3;background:#2a5b62}
.mont .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mont .ph .cover{border-radius:0;font-size:.78rem;padding:6px}
.fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.lab{font-size:.78rem;font-weight:700;color:var(--mute);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-weight:700;font-size:.84rem;padding:8px 11px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;line-height:1.2}
.chip.pick{border-color:var(--night2);background:#e6f6f1}.chip.ok{border-color:#1e9e6e;background:#d6f5e8}.chip.no{border-color:var(--coral);background:#ffe4e0}.chip:disabled{cursor:default;opacity:.55}.chip.used{opacity:.35}
/* M4B 슬롯 */
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed #b9cdc9;border-radius:14px;padding:6px 10px;background:#f3f8f7;font-weight:700;font-size:.88rem;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.slot b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--night2);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:.85rem}
.slot.filled{border-style:solid;border-color:var(--night2);background:#e6f6f1}.slot.ok{border-color:#1e9e6e;background:#d6f5e8}.slot.no{border-color:var(--coral);background:#ffe4e0}
/* M5 메모 */
.memo{background:#fff7dc;border-radius:14px;padding:14px;line-height:2.3;font-size:.95rem;font-weight:500}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--night2);padding:0 6px;text-align:center;font-weight:700;color:var(--night2);background:#ffffffaa;border-radius:6px 6px 0 0;cursor:pointer;font-family:inherit;font-size:.92rem;border-top:0;border-left:0;border-right:0}
.blank.sel{background:#fff;box-shadow:0 0 0 3px #ffc83d88}.blank.ok{color:#0d5b3f;border-color:#1e9e6e}.blank.no{color:#8a2a20;border-color:var(--coral)}
/* 시작·결과·순위 */
.nick{font:inherit;font-size:1.05rem;padding:13px 14px;border-radius:14px;border:2px solid var(--line);width:100%;color:var(--ink);background:#fff}
.nick:focus{outline:3px solid var(--sun);outline-offset:2px;border-color:var(--night2)}
.err{color:#b3261e;font-size:.82rem;font-weight:700;min-height:1.1em}
.board{display:flex;flex-direction:column;gap:4px}
.bl{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:#eef5f3;font-size:.88rem}
.bl.me{background:#fff2c2;outline:2px solid var(--sun)}
.bl .r{font-family:var(--display);font-size:1.05rem;color:var(--night2);text-align:center}
.bl .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .n em{font-style:normal;font-size:.66rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 4px;margin-left:5px;font-weight:500}
.bl .x{font-family:var(--display);color:#b27b00}.bl .t{color:var(--mute);font-variant-numeric:tabular-nums;font-size:.8rem}
.stars{display:flex;justify-content:center;gap:8px}.stars svg{width:54px;height:54px}.stars svg.on{animation:pop .5s both}
.stars svg.on:nth-child(2){animation-delay:.18s}.stars svg.on:nth-child(3){animation-delay:.36s}
.res{text-align:center}.title-get{font-family:var(--display);font-size:1.7rem;color:#0d5b3f}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#eef5f3;border-radius:14px;padding:10px 4px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--night2)}.stat span{font-size:.7rem;color:var(--mute)}
.reveal{width:min(190px,60%);margin:0 auto;border-radius:16px;overflow:hidden;aspect-ratio:1/3;box-shadow:0 0 0 4px var(--sun)}.reveal img{width:100%;height:100%;object-fit:cover;display:block}
.who{font-size:.85rem;color:var(--mute)}
/* 진행 경로: 사진 조각 */
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.7rem;font-weight:700;color:#9cc4bd;min-width:0}
.node i{display:block;width:100%;aspect-ratio:1.5;border-radius:10px;background-size:100% 500%;background-repeat:no-repeat;border:3px solid #ffffff33;filter:blur(4px) brightness(.45);transition:filter .6s}
.node:nth-child(1) i{background-position:0 0}.node:nth-child(2) i{background-position:0 25%}.node:nth-child(3) i{background-position:0 50%}.node:nth-child(4) i{background-position:0 75%}.node:nth-child(5) i{background-position:0 100%}
.node.done i{filter:none;border-color:var(--mint)}.node.now i{border-color:var(--sun);filter:blur(2px) brightness(.75)}
.node.now,.node.done{color:#fff}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const store=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

 let s=seen[key]||[];let free=[...Array(len).keys()].filter(i=>!s.includes(i));if(!free.length){s=[];free=[...Array(len).keys()]}
 const i=free[rnd(free.length)];s.push(i);seen[key]=s;store('gt_seen',seen);return i}
const S={nick:'',pi:0,n:0,hearts:3,xp:0,t0:0,tm:0,tag:'',place:'',note:'',fin:false,vars:[],tick:null,miss:0,max:0};

const speed=(limit,maxB)=>Math.round(Math.max(0,1-(Date.now()-S.tm)/1000/limit)*maxB/5)*5;

function endMission(pts,msg,ok){ /* pts: 기본 점수(최대 100) + 속도 보너스(최대 40) */
 const b=pts>0?speed(Math.max(25,45),40):0,tot=pts+b;S.xp+=tot;
 if(S.miss>0&&S.hearts>0)S.hearts--; hud();

 $('#stage .card').append(...box.childNodes);$('#next').onclick=()=>{S.n++;S.n>4?finish():render()};
 $('#next').scrollIntoView({block:'nearest',behavior:'smooth'})}

function m1a(){ /* 사진 단서 추리 */

 const paint=()=>{$('#cl').innerHTML=cl.slice(0,shown).map((c,i)=>`<div class="clue">단서 ${i+1}. ${c}</div>`).join('');$('#more').hidden=shown>=3||done};paint();
 $('#more').onclick=()=>{shown++;paint()};
 document.querySelectorAll('.th').forEach(b=>b.onclick=()=>{if(done||b.classList.contains('out'))return;
  if(+b.dataset.i===S.pi){done=true;b.classList.add('ok');document.querySelectorAll('.th').forEach(x=>{if(x!==b)x.classList.add('out')});$('#more').hidden=true;
   endMission(Math.max(0,100-(shown-1)*30-wrong*20),`맞아요! ${PT[S.pi].name} 어르신이에요.`,true)}
  else{wrong++;S.miss++;b.classList.add('no','out');b.classList.add('shake')}})}

function m2a(){ /* 번호 기억해서 입력 */
 let val='',peeks=0,tries=0,done=false,t;const keys=['A',...'0123456789'.split(''),'⌫'];
 $('#stage').innerHTML=frame(1,'인식표 번호를 기억하라','인식표는 잠깐만 보여요. 번호를 기억했다가 신고서에 정확히 입력하세요.',`<div class="tagbox"><div id="tg">${tagSvg(S.tag)}</div><div class="cover" id="cv" hidden>번호를 입력해 보세요</div></div><div class="timer"><i id="tm"></i></div><div class="digits" id="dg"></div><div class="keys" id="ks">${keys.map(k=>`<button class="key" data-k="${k}">${k}</button>`).join('')}</div><div class="row"><button class="go ghost" id="peek">다시 보기 (−30점)</button><button class="go" id="ok" disabled>제출</button></div>`,3);
 const showTag=(secs)=>{$('#cv').hidden=true;const bar=$('#tm');bar.style.transition='none';bar.style.width='100%';requestAnimationFrame(()=>{bar.style.transition=`width ${secs}s linear`;bar.style.width='0'});clearTimeout(t);t=setTimeout(()=>{if(!done)$('#cv').hidden=false},secs*1000)};
 const paint=()=>{$('#dg').innerHTML=[...Array(8)].map((_,i)=>`<div class="dg ${i===val.length?'cur':''}">${val[i]||''}</div>`).join('');$('#ok').disabled=val.length!==8||done};paint();showTag(5);

   if(tries>=3){done=true;clearTimeout(t);$('#cv').hidden=true;$('#ok').remove();$('#ks').remove();$('#peek').remove();endMission(0,`정답은 ${S.tag}였어요.`,false)}}}}

 const p=PT[S.pi],slots=[['top','상의 색'],['bot','하의 색'],['shoe','신발'],['item','소지품']],pick={};let peeks=0,t;

 const show=s=>{$('#cv').hidden=true;const bar=$('#tm');bar.style.transition='none';bar.style.width='100%';requestAnimationFrame(()=>{bar.style.transition=`width ${s}s linear`;bar.style.width='0'});clearTimeout(t);t=setTimeout(()=>$('#cv').hidden=false,s*1000)};show(8);

 $('#peek').onclick=()=>{if(peeks>=1)return;peeks++;$('#peek').disabled=true;show(4)};
 $('#ok').onclick=()=>{clearTimeout(t);$('#cv').hidden=true;let ok=0;document.querySelectorAll('.chips').forEach(c=>{c.querySelectorAll('.chip').forEach(b=>{b.disabled=true;b.classList.remove('pick');if(b.dataset.v===p[c.dataset.k])b.classList.add('ok');else if(b.dataset.v===pick[c.dataset.k])b.classList.add('no')});if(pick[c.dataset.k]===p[c.dataset.k])ok++});

 $('#stage').innerHTML=frame(3,'곁에서 어떻게 행동할까?',`${sc.s}<br>올바른 행동 3개를 고르세요.`,`${sc.im?`<img class="ban" src="${ART[sc.im]}" alt="">`:''}<div class="opts" id="o">${items.map((x,i)=>`<button class="opt" data-i="${i}">${em(x[0])}<span>${x[0]}</span></button>`).join('')}</div><button class="go" id="ok" disabled>확인</button>`,4);
 document.querySelectorAll('#o .opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i))sel.delete(i);else if(sel.size<3)sel.add(i);b.classList.toggle('pick',sel.has(i));$('#ok').disabled=sel.size!==3});
 $('#ok').onclick=()=>{let err=0;document.querySelectorAll('#o .opt').forEach((b,i)=>{b.disabled=true;b.classList.remove('pick');const y=items[i][1],s=sel.has(i);if(y)b.classList.add('ok');else if(s){b.classList.add('no')}if(y!==(s?1:0))err++});
  $('#ok').remove();S.miss=err?1:0;endMission(Math.max(0,100-Math.ceil(err/2)*30),err?'초록색이 올바른 행동이에요. 갑작스러운 접촉이나 혼자 두는 것은 피하세요.':'모두 맞혔어요. 안심시키고 곁을 지키는 것이 핵심이에요.',!err)}}
function m4b(){ /* 순서 퍼즐 + 함정 카드 */
 const trap=TRAP[draw('trap',TRAP.length)];const cards=shuf([...ORDER.map((c,i)=>({t:c[0],r:i,im:c[1],em:c[2]})),{t:trap[0],r:-1,im:'',em:trap[2]}]);const slot=[null,null,null,null,null];let tries=0,done=false;
 $('#stage').innerHTML=frame(3,'올바른 순서로 맞춰라','카드 6장 중 함정이 하나 있어요. 5장을 순서대로 놓으세요.',`<div class="slots" id="sl"></div><div class="lab">카드</div><div class="opts" id="pl"></div><button class="go" id="ok" disabled>순서 확인</button>`,5);
 const paint=(res)=>{$('#sl').innerHTML=slot.map((c,i)=>`<button class="slot ${c!=null?'filled':''} ${res&&c!=null?(cards[c].r===i?'ok':'no'):''}" data-i="${i}"><b>${i+1}</b>${c!=null?ci(cards[c])+cards[c].t:'비어 있어요'}</button>`).join('');
  $('#pl').innerHTML=cards.map((c,i)=>slot.includes(i)?'':`<button class="opt" data-c="${i}">${ci(c)}<span>${c.t}</span></button>`).join('');$('#ok').disabled=slot.some(x=>x==null)||done;
  document.querySelectorAll('#pl .opt').forEach(b=>b.onclick=()=>{if(done)return;const e=slot.indexOf(null);if(e>=0){slot[e]=+b.dataset.c;paint()}});
  document.querySelectorAll('#sl .slot').forEach(b=>b.onclick=()=>{if(done)return;slot[+b.dataset.i]=null;paint()})};paint();
 $('#ok').onclick=()=>{const right=slot.every((c,i)=>cards[c].r===i);tries++;
  if(right){done=true;paint(true);$('#ok').remove();$('#pl').remove();endMission(Math.max(30,100-(tries-1)*30),'순서가 완벽해요. 발견 → 확인 → 신고 → 보호 → 인계!',true)}
  else{S.miss++;paint(true);$('#sl').classList.add('shake');setTimeout(()=>{$('#sl').classList.remove('shake');for(let i=0;i<5;i++)if(cards[slot[i]].r!==i)slot[i]=null;if(tries>=3){done=true;for(let i=0;i<5;i++)slot[i]=cards.findIndex(c=>c.r===i);paint(true);$('#ok').remove();$('#pl').remove();endMission(0,'정답 순서를 보여 드렸어요.',false)}else paint()},900)}}}

/* ===== 미션 5: 인계 ===== */
function m5a(){ /* 인계 메모 빈칸 (앞에서 본 정보를 기억) */
 const p=PT[S.pi],o=PT.filter((_,i)=>i!==S.pi),dn=shuf(o)[0],dp=shuf(o)[0],ds=shuf(o)[0];
 const alt=S.tag.replace(/\d/g,c=>String((+c+3)%10));
 const chips=shuf([[S.place,'p'],[dp.place,'x'],[S.tag,'t'],[alt,'x'],[S.note,'n'],[ds.note,'x']]);const fill={p:null,t:null,n:null};let cur='p';
 $('#stage').innerHTML=frame(4,'경찰에게 인계 메모를 완성하라','앞에서 확인한 정보로 빈칸을 채우세요. 빈칸을 누르고 카드를 고르면 들어가요.',`<div class="memo">발견 장소는 <button class="blank sel" data-b="p">　</button>이고, 인식표 번호는 <button class="blank" data-b="t">　</button>입니다. 발견 당시 어르신은 <button class="blank" data-b="n">　</button>.</div><div class="chips" id="ch">${chips.map((c,i)=>`<button class="chip" data-i="${i}">${c[0]}</button>`).join('')}</div><button class="go" id="ok" disabled>인계하기</button>`,5);
 const paint=()=>{document.querySelectorAll('.blank').forEach(b=>{const v=fill[b.dataset.b];b.textContent=v==null?'　':chips[v][0];b.classList.toggle('sel',b.dataset.b===cur)});
  document.querySelectorAll('#ch .chip').forEach((c,i)=>c.classList.toggle('used',Object.values(fill).includes(i)));$('#ok').disabled=Object.values(fill).some(v=>v==null)};
 document.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{cur=b.dataset.b;if(fill[cur]!=null){fill[cur]=null}paint()});
 document.querySelectorAll('#ch .chip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;if(Object.values(fill).includes(i))return;fill[cur]=i;const nx=['p','t','n'].find(k=>fill[k]==null);if(nx)cur=nx;paint()});
 $('#ok').onclick=()=>{let ok=0;document.querySelectorAll('.blank').forEach(b=>{b.disabled=true;const k=b.dataset.b,good=chips[fill[k]][1]===k;b.classList.remove('sel');b.classList.add(good?'ok':'no');if(good)ok++;else b.textContent=chips[fill[k]][0]+' → '+({p:S.place,t:S.tag,n:S.note})[k]});
  document.querySelectorAll('#ch .chip').forEach(c=>c.disabled=true);$('#ok').remove();S.miss=3-ok;endMission(ok===3?100:ok*33,ok===3?'장소, 번호, 상태를 정확히 전했어요.':`${ok}/3개 맞혔어요. 정확한 정보가 어르신을 빨리 가족에게 데려다줘요.`,ok===3)}}
function m5b(){ /* 전달할 정보 분류 */
 const items=shuf([...shuf(HAND.need).slice(0,4).map(t=>[t,1]),...shuf(HAND.no).slice(0,4).map(t=>[t,0])]);const sel=new Set();
 $('#stage').innerHTML=frame(4,'경찰에게 꼭 전할 정보는?','전달해야 할 정보 4개를 고르세요. 불필요한 정보는 혼란만 줘요.',`<div class="cards" id="cd">${items.map((x,i)=>`<button class="opt" data-i="${i}">${em(x[0])}<span>${x[0]}</span></button>`).join('')}</div><button class="go" id="ok" disabled>인계하기</button>`,4);
 document.querySelectorAll('#cd .opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i))sel.delete(i);else if(sel.size<4)sel.add(i);b.classList.toggle('pick',sel.has(i));$('#ok').disabled=sel.size!==4});
 $('#ok').onclick=()=>{let err=0;document.querySelectorAll('#cd .opt').forEach((b,i)=>{b.disabled=true;b.classList.remove('pick');const y=items[i][1],s=sel.has(i);if(y)b.classList.add('ok');else if(s)b.classList.add('no');if(y!==(s?1:0))err++});
  $('#ok').remove();S.miss=err?1:0;endMission(Math.max(0,100-Math.ceil(err/2)*30),err?'초록색이 꼭 전해야 할 정보예요.':'필요한 정보만 정확히 전했어요.',!err)}}

const BANK=[[m1a,m1b],[m2a,m2b],[m3a,m3b],[m4a,m4b],[m5a,m5b]];
function render(){S.miss=0;S.tm=Date.now();hud();BANK[S.n][S.vars[S.n]]();window.scrollTo({top:0})}

/* ===== 시작·기록·결과 ===== */
const API='https://script.google.com/macros/s/AKfycbx9G-PAjHJH9Q6T4e9UouISIpnPeNI17ueOkLUfuBY6ICumjPJE9g4hnXzWurKf8es/exec';
async function call(b){ /* API가 비어 있으면 이 기기에만 저장하는 체험 모드 */
 if(!API){const L=store('gt_board')||[];if(b.a==='bsubmit'){L.push({...b.d,id:L.length+2,ts:Date.now()});store('gt_board',L);return{ok:1,id:L.length+1}}return L}
 const r=await fetch(API,{method:'POST',body:JSON.stringify(b)});return r.json()}
let BD=[],BOK=true;
const cmp=(a,b)=>b.xp-a.xp||a.sec-b.sec||(a.id||0)-(b.id||0);
async function loadBoard(){try{const r=await call({a:'blist'});if(!Array.isArray(r))throw 0;BD=r.sort(cmp);BOK=true}catch(e){BOK=false}}
function boardHtml(meId){if(!BOK)return '<p class="hint">순위표를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>';if(!BD.length)return '<p class="hint">아직 기록이 없어요. 첫 번째 도전자가 되어 보세요!</p>';
 const top=BD.slice(0,10);const row=(r,i)=>`<div class="bl ${r.id===meId?'me':''}"><span class="r">${i+1}</span><span class="n">${String(r.nick).replace(/[<>&"']/g,'')}</span><span class="x">${r.xp}점</span><span class="t">${fmt(r.sec)}</span></div>`;
 let h=top.map(row).join('');const i=BD.findIndex(r=>r.id===meId);if(meId&&i>=10)h+=row(BD[i],i);return h}
async function start(){clearInterval(S.tick);$('#hud').hidden=true;$('#path').hidden=true;
 $('#stage').innerHTML=`<section class="card"><div class="tagline"><span class="badge">배회·실종 치매환자 발견 모의훈련</span></div><h1>골든타임 미션</h1><p class="hint">길 잃은 어르신을 발견해 가족 품으로 돌려보내는 5개 퍼즐입니다. 매번 다른 어르신과 문제가 나와요.</p>
 <div><label class="lab" for="nick">닉네임</label><input class="nick" id="nick" maxlength="8" autocomplete="off" placeholder="2~8자 별명" value="${S.nick}"><div class="err" id="er"></div><p class="hint">실명이나 전화번호 대신 별명을 써 주세요. 순위표에 모든 참가자에게 보여요.</p></div>
 <button class="go" id="go">미션 시작</button></section>
 <section class="card"><h2>명예의 전당</h2><div class="board" id="bd"><p class="hint">불러오는 중…</p></div><p class="hint">점수가 높은 순, 같으면 빠른 순입니다. 모든 참가자의 기록이 함께 보여요.</p></section>`;
 $('#go').onclick=()=>{const v=$('#nick').value.trim();const bad=!/^[0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ_ ]{2,8}$/.test(v)?'2~8자의 한글·영문·숫자로 입력해 주세요.':/\d{4,}/.test(v)?'숫자를 길게 쓰면 전화번호처럼 보여요. 별명으로 바꿔 주세요.':BAD_WORDS.some(w=>v.toLowerCase().includes(w))?'사용할 수 없는 표현이에요. 다른 별명을 써 주세요.':'';
  if(bad){$('#er').textContent=bad;return}S.nick=v;begin()};
 await loadBoard();const bd=$('#bd');if(bd)bd.innerHTML=boardHtml()}
function begin(){const last=store('gt_last');let n;do{n=rnd(5)}while(n===last);store('gt_last',n);
 Object.assign(S,{pi:n,n:0,hearts:3,xp:0,fin:false,t0:Date.now()});
 S.tag='A01'+String(rnd(100000)).padStart(5,'0');S.place=PT[n].place;S.note=PT[n].note;
 S.vars=BANK.map(()=>rnd(2));$('#hud').hidden=false;$('#path').hidden=false;$('#xpn').textContent='';tickClock();clearInterval(S.tick);S.tick=setInterval(tickClock,1000);render()}
async function finish(){S.fin=true;clearInterval(S.tick);hud();const st=Math.max(1,S.hearts),s=sec();
 const t=S.xp>=560?'골든타임 지킴이':S.xp>=400?'든든한 이웃':'첫걸음 도우미';
 $('#stage').innerHTML=`<section class="card res"><div class="tagline" style="justify-content:center"><span class="badge">미션 완료</span></div><div class="reveal"><img src="${IMG[S.pi]}" alt=""></div><p class="who">${PT[S.pi].name} 어르신이 가족 품으로 돌아갔어요.</p><div class="stars">${[1,2,3].map(i=>star(i<=st)).join('')}</div><div class="title-get">${t}</div>
 <div class="stat"><div><b>${S.xp}</b><span>점수 / 700</span></div><div><b>${fmt(s)}</b><span>걸린 시간</span></div><div><b id="rk">…</b><span>전체 순위</span></div></div>
 <button class="go" id="again">한 번 더 도전 (새 문제)</button><button class="go ghost" id="home">처음으로</button></section>
 <section class="card"><h2>명예의 전당</h2><div class="board" id="bd"><p class="hint">기록을 저장하는 중…</p></div></section>`;
 $('#again').onclick=begin;$('#home').onclick=start;$('#hud').hidden=true;$('#path').hidden=true;window.scrollTo({top:0});
 let id=0,saved=true;try{const r=await call({a:'bsubmit',d:{nick:S.nick,xp:S.xp,sec:s,stars:st}});if(r.ok)id=r.id;else saved=false}catch(e){saved=false}
 await loadBoard();const i=BD.findIndex(r=>r.id===id);$('#rk').textContent=i>=0?(i+1)+'위':'-';
 $('#bd').innerHTML=(saved?'':'<p class="hint">기록을 저장하지 못했어요. 네트워크를 확인해 주세요.</p>')+boardHtml(id)}
start();
</script>

</body></html>
