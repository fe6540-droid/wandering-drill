   setTimeout(()=>{if(K.r1<2){K.r1++;round()}else{show(`<section class="card" style="text-align:center"><h1>모두 찾았어요! ⭐⭐⭐</h1><p class="sub">경보 글을 잘 읽고 옷 색을 비교했어요. 길을 잃은 분 같으면 어른께 알려요!</p><button class="big" id="nx">다음 ▶</button></section>`,'모두 찾았어요! 길을 잃은 분 같으면 어른께 알려요.');$('#nx').onclick=s2}},1300)}

 const C=shuf([{id:'police',img:KS.police,n:'경찰관 아저씨',ok:1},{id:'shop',img:KS.shop,n:'가게 아저씨',ok:1},{id:'friend',img:KS.friend,n:'친구',ok:0,t:'친구도 아이예요. 큰 어른께 알려야 해요!'},{id:'follow',img:KS.follow,n:'혼자 따라가요',ok:0,t:'혼자 따라가면 위험해요. 어른께 알려요!'},{id:'ignore',img:KS.ignore,n:'모른 척 지나가요',ok:0,t:'도움이 필요한 분이에요. 어른께 알려요!'}]);

  else{b.classList.add('no');toast(c.t);say(c.t)}})}

/* ---- 3. 미로 (3판: 6×6 → 7×7 → 8×8, 마지막은 경찰차가 어르신께) ---- */
function mzGen(N,loop,minLen){let best=null;
 for(let t=0;t<300;t++){const blk=new Set(),ix=(r,c)=>r*N+c;for(let i=0;i<N*N;i++)blk.add(i);
  const seen=new Set([0]),st=[[0,0]];blk.delete(0);
  while(st.length){const[r,c]=st[st.length-1],nb=[[r-2,c],[r+2,c],[r,c-2],[r,c+2]].filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!seen.has(ix(a,b)));
   if(!nb.length){st.pop();continue}const[a,b]=nb[rnd(nb.length)];seen.add(ix(a,b));blk.delete(ix(a,b));blk.delete(ix((r+a)/2,(c+b)/2));st.push([a,b])}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!blk.has(ix(r,c)))continue;
   if(N%2===0&&(r===N-1||c===N-1)){if(Math.random()<.45)blk.delete(ix(r,c));continue}
   if((r%2)!==(c%2)&&r>0&&c>0&&r<N-1&&c<N-1&&Math.random()<loop)blk.delete(ix(r,c))}
  const a=[N-1,0],h=[0,N-1];blk.delete(ix(a[0],a[1]));blk.delete(ix(h[0],h[1]));
  const q=[[a[0],a[1],0]],sn=new Set([ix(a[0],a[1])]);let d=-1;
  while(q.length){const[r,c,s]=q.shift();if(r===h[0]&&c===h[1]){d=s;break}[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const R=r+dr,C=c+dc,k=R*N+C;if(R<0||C<0||R>=N||C>=N||blk.has(k)||sn.has(k))return;sn.add(k);q.push([R,C,s+1])})}
  if(d<0)continue;const m={a,h,blk,d};if(d>=minLen)return m;if(!best||d>best.d)best=m}
 return best}
const MZ=[{n:6,min:14,t:'home'},{n:7,min:20,t:'home'},{n:8,min:24,t:'car'}];
function s3(){steps(2);K.mr=0;mround()}
function mround(){const cfg=MZ[K.mr],N=cfg.n,car=cfg.t==='car',m=mzGen(N,.08,cfg.min);K.N=N;K.car=car;K.m=m;K.pos=m.a.slice();K.fl=new Set();
 for(let i=0;i<N*N;i++)if(!m.blk.has(i)&&Math.random()<.1&&i!==m.a[0]*N+m.a[1]&&i!==m.h[0]*N+m.h[1])K.fl.add(i);
 const ttl=car?'🚓 경찰차가 어르신께 가요!':'🏠 집에 가는 길을 도와요!',sub=car?'경찰차를 어르신이 계신 곳까지 안내해 주세요. 나무가 있으면 지나갈 수 없어요. 막다른 길도 있어요!':'할머니·할아버지를 집까지 안내해 주세요. 나무가 있으면 지나갈 수 없어요.';
 show(`<section class="card"><p class="q">${ttl} (${K.mr+1}/3)</p><p class="sub">${sub}</p><div class="maze" id="mz" style="grid-template-columns:repeat(${N},minmax(0,1fr))"></div><div class="dp"><button class="u" data-d="u" aria-label="위">⬆️</button><button class="l" data-d="l" aria-label="왼쪽">⬅️</button><button class="d" data-d="d" aria-label="아래">⬇️</button><button class="r" data-d="r" aria-label="오른쪽">➡️</button></div><div class="toast" id="toast">화살표를 누르거나 하얀 점선 칸을 눌러요.</div></section>`,ttl.replace(/[^가-힣 !]/g,'')+' 화살표를 눌러 안내해요.');
 drawM();document.querySelectorAll('.dp button').forEach(b=>b.onclick=()=>mv(b.dataset.d));
 document.removeEventListener('keydown',K.kd);K.kd=e=>{const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(k){e.preventDefault();mv(k)}};document.addEventListener('keydown',K.kd)}
function drawM(){const m=K.m,N=K.N,[pr,pc]=K.pos;let h='';
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=r*N+c,cls=['mc',(r+c)%2?'b':''];let im='';
  if(m.blk.has(k))im=`<img src="${KS.tree}" alt="나무">`;else if(r===m.h[0]&&c===m.h[1]){if(K.car){im=`<img src="${personURL(K.p,K.P,K.o)}" alt="어르신">`;cls.push('gp')}else im=`<img src="${KS.house}" alt="집">`}else if(K.fl.has(k))im=`<img src="${KS.flower}" alt="">`;
  if(r===pr&&c===pc){if(K.car)im=`<img src="${SPRU.car}" alt="경찰차">`;else{cls.push('pl');im=`<img src="${personURL(K.p,K.P,K.o)}" alt="어르신">`}}
  else if(Math.abs(r-pr)+Math.abs(c-pc)===1&&!m.blk.has(k))cls.push('nb');
  h+=`<button class="${cls.join(' ')}" data-r="${r}" data-c="${c}" aria-label="칸">${im}</button>`}
 $('#mz').innerHTML=h;document.querySelectorAll('.mc.nb').forEach(b=>b.onclick=()=>go(+b.dataset.r,+b.dataset.c))}
function mv(d){const[pr,pc]=K.pos,dd={u:[-1,0],d:[1,0],l:[0,-1],r:[0,1]}[d];go(pr+dd[0],pc+dd[1])}
function go(r,c){const m=K.m,N=K.N;if(r<0||c<0||r>=N||c>=N){toast('여기는 길의 끝이에요. 다른 쪽으로 가요!');return}
 if(m.blk.has(r*N+c)){toast('나무가 있어서 지나갈 수 없어요. 돌아가요!');say('나무가 있어요. 돌아가요!');return}
 K.pos=[r,c];drawM();
 if(r===m.h[0]&&c===m.h[1]){document.removeEventListener('keydown',K.kd);const last=K.mr>=2,t=K.car?'경찰차가 어르신을 만났어요! 🎉':'집에 도착했어요! 🎉';toast(t,1);say(K.car?'경찰차가 어르신을 만났어요! 잘했어요!':'집에 도착했어요! 잘했어요!');
  $('#stage').querySelector('.card').insertAdjacentHTML('beforeend',`<button class="big" id="nx">${last?'다음 ▶':'다음 길 ▶'}</button>`);document.querySelectorAll('.dp button').forEach(b=>b.disabled=true);$('#nx').onclick=()=>{if(last)fin();else{K.mr++;mround()}}}}
