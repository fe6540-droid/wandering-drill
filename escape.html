 document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;if(+b.dataset.g){S.care++;b.classList.add('ok');$('#mv').textContent=Math.round(S.care/3*100)+'%';$('#mb').style.width=S.care/3*100+'%';msg($('#log'),`<div class="fb ok">좋아요. 어르신이 편안해져요.</div>`);if(S.care>=3)ev()}else{b.classList.add('no');msg($('#log'),pen(10,'어르신에게 위험하거나 도움이 안 돼요.'))}})}
function ev(){const O=[['곁에 앉아 "조금만 더 계셔요, 곧 가족이 와요" 하고 부드럽게 말한다',1],['팔을 붙잡아 앉힌다',0],['"가시면 안 돼요" 하고 소리친다',0]];S.hintMsg=()=>'붙잡거나 소리치지 말고 곁에서 부드럽게 말하세요.';
 $('#stage').querySelector('.card').insertAdjacentHTML('beforeend',`<div class="call">⚠️ 갑자기 어르신이 일어나 걸어가려 해요! 어떻게 할까요?</div><div class="opts" id="o2">${shuf(O).map(x=>`<button class="opt" data-g="${x[1]}">${x[0]}</button>`).join('')}</div>`);$('#o2').scrollIntoView({block:'nearest',behavior:'smooth'});
 document.querySelectorAll('#o2 .opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;if(+b.dataset.g){document.querySelectorAll('#o2 .opt').forEach(x=>x.disabled=true);b.classList.add('ok');msg($('#log'),`<div class="fb ok">어르신이 다시 앉았어요. 곧 경찰이 도착합니다.</div><button class="go" id="nx" style="margin-top:8px">경찰 도착</button>`);$('#nx').onclick=()=>go(4)}else{b.disabled=true;b.classList.add('no');msg($('#log'),pen(15,'어르신이 더 불안해해요.'))}})}
function mzGen(N,loop,minLen){let best=null;
 for(let t=0;t<300;t++){const blk=new Set(),ix=(r,c)=>r*N+c;for(let i=0;i<N*N;i++)blk.add(i);
  const seen=new Set([0]),st=[[0,0]];blk.delete(0);
  while(st.length){const[r,c]=st[st.length-1],nb=[[r-2,c],[r+2,c],[r,c-2],[r,c+2]].filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!seen.has(ix(a,b)));
   if(!nb.length){st.pop();continue}const[a,b]=nb[rnd(nb.length)];seen.add(ix(a,b));blk.delete(ix(a,b));blk.delete(ix((r+a)/2,(c+b)/2));st.push([a,b])}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!blk.has(ix(r,c)))continue;
   if(N%2===0&&(r===N-1||c===N-1)){if(Math.random()<.45)blk.delete(ix(r,c));continue}
   if((r%2)!==(c%2)&&r>0&&c>0&&r<N-1&&c<N-1&&Math.random()<loop)blk.delete(ix(r,c))}
  const a=[N-1,0],h=[0,N-1];blk.delete(ix(a[0],a[1]));blk.delete(ix(h[0],h[1]));
  const q=[[a[0],a[1],0]],sn=new Set([ix(a[0],a[1])]);let d=-1;
  while(q.length){const[r,c,s]=q.shift();if(r===h[0]&&c===h[1]){d=s;break}[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const R=r+dr,C=c+dc,k=R*N+C;if(R<0||C<0||R>=N||C>=N||blk.has(k)||sn.has(k))return;sn.add(k);q.push([R,C,s+1])})}
  if(d<0)continue;const m={a,h,blk,d};if(d>=minLen)return m;if(!best||d>best.d)best=m}
 return best}
/* ===== 챕터 5: 출동 — 경찰차 미로 (12×12 + 시간 압박) ===== */
const MZLIM=70;
function cM(){const N=12,m=mzGen(N,.1,44);S.m=m;S.pos=m.a.slice();S.trail=new Set([m.a[0]*N+m.a[1]]);S.mt0=Date.now();S.mlate=0;S.mdone=0;
 S.hintMsg=()=>'막다른 길이 많아요. 오른쪽 위의 어르신 쪽으로 가다가 막히면 되돌아가세요. 지나온 길은 노랗게 표시돼요.';
 $('#stage').innerHTML=`<section class="card"><div class="tagline"><span class="badge">챕터 5</span>출동 · ${S.ep.nm}</div><h1>경찰차를 어르신께 안내하라</h1><p class="hint">112 신고가 접수됐다. 건물에 막힌 골목을 돌아 ${S.ep.loc}의 어르신께 가장 빨리 도착해야 한다. 막다른 길에서 시간을 잃지 마라.</p><div class="mzbar" id="mzbar"><span id="mzt">${MZLIM}초</span><i><b id="mzb"></b></i></div><div class="maze2" id="mz" style="grid-template-columns:repeat(${N},minmax(0,1fr))"></div><div class="dp2"><button class="u" data-d="u" aria-label="위">⬆️</button><button class="l" data-d="l" aria-label="왼쪽">⬅️</button><button class="d" data-d="d" aria-label="아래">⬇️</button><button class="r" data-d="r" aria-label="오른쪽">➡️</button></div><div id="mzlog"></div></section>`;
 drawM2();document.querySelectorAll('.dp2 button').forEach(b=>b.onclick=()=>mv2(b.dataset.d));
 S.kd=e=>{const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(k){e.preventDefault();mv2(k)}};document.addEventListener('keydown',S.kd);
 const id=S.mi=setInterval(()=>{if(S.over||S.ch!==4||S.mi!==id||S.mdone){clearInterval(id);return}
  const e=(Date.now()-S.mt0)/1000,l=Math.max(0,MZLIM-e);const t=$('#mzt'),b=$('#mzb');if(!t)return;t.textContent=l>0?Math.ceil(l)+'초':'지연 중!';b.style.width=(l/MZLIM*100)+'%';
  if(l<=0&&!S.mlate){S.mlate=1;$('#mzbar').classList.add('late');msg($('#mzlog'),pen(20,'출동이 늦어지고 있어요.'))}},250)}
function drawM2(){const m=S.m,N=12,[pr,pc]=S.pos;let h='';
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=r*N+c,cl=['mx',(r+c)%2?'b':''];let im='';
  if(m.blk.has(k))im=`<img src="${SPRU.bld}" alt="">`;
  if(r===m.h[0]&&c===m.h[1]){im=`<img src="${personURL(S.p,S.P,S.o)}" alt="어르신">`;cl.push('gp')}
  if(S.trail.has(k))cl.push('tr');
  if(r===pr&&c===pc)im=`<img src="${SPRU.car}" alt="경찰차">`;
  else if(Math.abs(r-pr)+Math.abs(c-pc)===1&&!m.blk.has(k))cl.push('nb');
  h+=`<button class="${cl.join(' ')}" data-r="${r}" data-c="${c}" aria-label="칸">${im}</button>`}
 $('#mz').innerHTML=h;document.querySelectorAll('.mx.nb').forEach(b=>b.onclick=()=>go2(+b.dataset.r,+b.dataset.c))}
function mv2(d){if(S.mdone)return;const[pr,pc]=S.pos,dd={u:[-1,0],d:[1,0],l:[0,-1],r:[0,1]}[d];go2(pr+dd[0],pc+dd[1])}
function go2(r,c){const N=12,m=S.m;if(S.mdone||r<0||c<0||r>=N||c>=N||m.blk.has(r*N+c))return;
 S.pos=[r,c];S.trail.add(r*N+c);drawM2();
 if(r===m.h[0]&&c===m.h[1]){S.mdone=1;document.removeEventListener('keydown',S.kd);clearInterval(S.mi);const sec=Math.round((Date.now()-S.mt0)/1000);
  msg($('#mzlog'),`<div class="fb ok">경찰차 도착! 출동 ${sec}초${S.mlate?' (지연 −20초 반영)':' · 제시간 도착'}</div><button class="go" id="nx" style="margin-top:8px">어르신께 다가가기</button>`);$('#nx').onclick=()=>go(5)}}
/* ===== 챕터 6: 인계 ===== */
function c5(){const P=S.P,other=EPS.filter(e=>e!==S.ep),alt=S.tag.replace(/\d/g,c=>String((+c+3)%10)),st2=S.w==='cold'?'더위에 땀을 흘리며 목마르다고 하셨어요':'추위에 떨고 계셨어요';
 const quotes=['집에 가야 해요','딸이 기다리고 있어요'],oq=quotes.find(x=>x!==S.said);
 const chips=shuf([[S.ep.loc,'p'],[other[0].loc,'x'],[S.tag,'t'],[alt,'x'],[S.state,'n'],[st2,'x'],[S.said,'q'],[oq,'x']]);const fill={p:null,t:null,n:null,q:null};let cur='p';
 S.hintMsg=()=>'앞에서 확인한 내용과 똑같은 카드를 빈칸에 넣으세요. 다른 장소·번호·계절 카드는 함정이에요.';
 $('#stage').innerHTML=`<section class="card"><div class="tagline"><span class="badge">챕터 6</span>인계 · 경찰 도착</div><h1>인계 메모를 완성하라</h1>${scene('police',[],{big:1})}<div class="memo">발견 장소는 <button class="blank sel" data-b="p">　</button>이고, 인식표 번호는 <button class="blank" data-b="t">　</button>입니다. 어르신은 <button class="blank" data-b="n">　</button>. 어르신이 한 말은 "<button class="blank" data-b="q">　</button>"입니다.</div><div class="chips" id="ch">${chips.map((c,i)=>`<button class="chip" data-i="${i}">${c[0]}</button>`).join('')}</div><button class="go" id="ok" disabled>인계하기</button><div id="log"></div></section>`;
 const paint=()=>{document.querySelectorAll('.blank').forEach(b=>{const v=fill[b.dataset.b];b.textContent=v==null?'　':chips[v][0];b.classList.toggle('sel',b.dataset.b===cur)});document.querySelectorAll('#ch .chip').forEach((c,i)=>c.classList.toggle('used',Object.values(fill).includes(i)));$('#ok').disabled=Object.values(fill).some(v=>v==null)};
 document.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{cur=b.dataset.b;fill[cur]=null;paint()});
 document.querySelectorAll('#ch .chip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;if(Object.values(fill).includes(i))return;fill[cur]=i;const nx=['p','t','n','q'].find(k=>fill[k]==null);if(nx)cur=nx;paint()});
 $('#ok').onclick=()=>{const bad=['p','t','n','q'].filter(k=>chips[fill[k]][1]!==k);if(!bad.length){end(true);return}bad.forEach(k=>{const b=document.querySelector(`.blank[data-b="${k}"]`);b.classList.add('no');fill[k]=null});$('#log').innerHTML='';msg($('#log'),pen(15,`${bad.length}곳이 틀렸어요. 기억을 다시 떠올려 보세요.`));setTimeout(()=>{document.querySelectorAll('.blank').forEach(b=>b.classList.remove('no'));cur=bad[0];paint()},900)}}
function end(win){S.over=1;clearInterval(T);const r=rem(),sec=Math.floor((Date.now()-S.t0)/1000)+S.pen,pts=win?Math.max(0,500+r-S.usedHint*50-S.wrong*20):0,st=!win?1:pts>=900?3:pts>=700?2:1;
 $('#hud').hidden=true;$('#hint').hidden=true;$('#nb').hidden=true;
 $('#stage').innerHTML=`<section class="card res" style="text-align:center"><div class="tagline" style="justify-content:center"><span class="badge">${win?'탈출 성공':'시간 종료'}</span></div>${win?`<div class="reveal" style="width:120px;aspect-ratio:42/72;box-shadow:none;background:linear-gradient(#bfe8fb,#e9f7ef);border-radius:12px"><img src="${personURL(S.p,S.P,S.o)}" alt=""></div>`:''}<div class="stars" style="display:flex;justify-content:center;gap:8px">${[1,2,3].map(i=>star(i<=st)).join('')}</div><div class="big">${win?`${S.P.n} 어르신, 가족 품으로`:'아쉬워요, 한 번 더!'}</div><p>${win?`걸린 시간 ${fmt(sec)} (감점 포함) · 힌트 ${S.usedHint}번 · 실수 ${S.wrong}번`:'단서를 모으고 신고·보호·인계까지 이어 가는 연습을 다시 해 보세요.'}</p>${win?`<p>점수 <b>${pts}</b></p>`:''}<button class="go" id="again">새로운 상황으로 다시 하기</button><button class="go ghost" id="hm">처음으로</button></section>`;$('#again').onclick=start;$('#hm').onclick=home;window.scrollTo({top:0})}
